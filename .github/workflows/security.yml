# Security gates (security-hardening program, 2026-09-08).
#
#   gitleaks    secrets in the working tree           BLOCKING
#   npm audit   high/critical advisories              report-only until the baseline is clean
#   CodeQL      static analysis                       blocking on alerts in the Security tab
#
# Runs on every PR and push to the tier branches, and weekly so a new advisory
# against an unchanged tree is still seen.
#
# `npm audit` needs a lockfile, and this package has none of its own: its
# dependencies are `workspace:*` siblings resolved inside the pinned
# deepseek-harness checkout. The audit therefore runs against the staged
# publishable manifest (no runtime dependencies) plus the devDependency
# toolchain, which is what a consumer actually installs.
name: security
on:
  pull_request:
  push:
    branches: [dev, test, prod]
  schedule:
    - cron: '23 6 * * 1'
permissions:
  contents: read
jobs:
  gitleaks:
    name: secrets (gitleaks, working tree)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: gitleaks
        # The WORKING TREE at this commit, not the history: a historical leak is
        # a rotation task for the operator, not a reason to block every PR. The
        # tree scan is BLOCKING: a secret committed now fails the check.
        run: |
          set -euo pipefail
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks detect --no-git --source . --config .gitleaks.toml --redact --no-banner --exit-code 1
  npm-audit:
    name: dependencies (npm audit, high+)
    runs-on: ubuntu-latest
    # REPORT-ONLY for now: the job passes and annotates. Flip to blocking by
    # removing the `|| echo` once the baseline is clean.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.19'
      - name: npm audit (devDependency toolchain)
        run: |
          set -euo pipefail
          # Resolve only what npm can see: drop the workspace:* siblings, which
          # are not registry packages, and the first-party SDK pin, which is
          # audited in its own repository and may not be published yet during
          # a coordinated SDK change. Audit the rest.
          node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync("package.json", "utf8"));
            for (const k of ["dependencies", "devDependencies"]) {
              for (const [name, spec] of Object.entries(m[k] ?? {})) {
                if (String(spec).startsWith("workspace:") || name.startsWith("@crowdedkingdoms/")) delete m[k][name];
              }
            }
            delete m.scripts;
            fs.mkdirSync(".audit", { recursive: true });
            fs.writeFileSync(".audit/package.json", JSON.stringify(m, null, 2));
          '
          cd .audit
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm audit --audit-level=high || echo "::warning::npm audit found high/critical advisories (report-only until the baseline is clean)"
  codeql:
    name: SAST (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
